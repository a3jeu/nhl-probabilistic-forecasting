[project]
name = "nhl-forecast"
version = "0.1.0"
description = "Prédiction probabiliste des résultats de matchs de la LNH : comparaison de modèles statistiques et d'apprentissage automatique (mémoire de maîtrise, UQTR)."
readme = "README.md"
license = "MIT"
authors = [{ name = "Tommy Gagné" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    # Données
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "requests>=2.32",
    "tenacity>=9.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "hockey-scraper>=1.40.3", # scraper PBP/shifts (API JSON + rapports HTML)
    # Base de données
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "cryptography>=43.0", # requis par PyMySQL pour l'auth caching_sha2 de MySQL 8
    # Configuration
    "python-dotenv>=1.0",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    # Statistiques et modélisation
    "scipy>=1.14",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    # Visualisation
    "matplotlib>=3.9",
    "seaborn>=0.13",
    # Utilitaires
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Réseaux de neurones (MLP, LSTM) — installation lourde, à activer au besoin : uv sync --extra deep
deep = ["torch>=2.4"]
# Approches bayésiennes : uv sync --extra bayes
bayes = ["pymc>=5.16", "arviz>=0.19"]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "nbstripout>=0.7",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nhl_forecast"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests nécessitant le réseau ou MySQL (exclus par défaut avec -m 'not integration')",
]
